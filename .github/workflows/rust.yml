name: Rust

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - flavor: release-debug
          - flavor: release
            env: RUSTFLAGS="-Zlocation-detail=none -Zfmt-debug=none -Clto=fat -Zub-checks=no -Zsaturating-float-casts=no -Ztrap-unreachable=no -Zmir-opt-level=4"

    runs-on: ubuntu-latest

    name: Build ${{ matrix.flavor }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply Japanese UI
        if: github.ref_name == 'japanese-ui' || github.ref_name == 'japanese-font-fix' || github.ref_name == 'jit-pc-end-fix' || github.ref_name == 'overlay-invalidation-test' || github.ref_name == 'overlay-range-invalidation' || github.ref_name == 'overlay-perf-diagnostic' || github.ref_name == 'wram-unmapped-fix' || github.ref_name == 'jit-churn-diagnostic' || github.ref_name == 'overlay-hotness-reset-test' || github.ref_name == 'overlay-jit-threshold-test' || github.ref_name == 'gpu-vram-perf-diagnostic' || github.ref_name == 'vram-readall-breakdown-diagnostic' || github.ref_name == 'partial-vram-update-test' || github.ref_name == 'partial-vram-update-b-full-test' || github.ref_name == 'partial-vram-3d-only-test' || github.ref_name == 'partial-vram-3d-only-nolog-test' || github.ref_name == 'practical-clean-build' || github.ref_name == 'frame-bottleneck-diagnostic' || github.ref_name == 'frame-bottleneck-block-pc' || github.ref_name == 'frame-bottleneck-cart-phase' || github.ref_name == 'frame-bottleneck-compile-detail' || github.ref_name == 'frame-bottleneck-write-detail' || github.ref_name == 'frame-bottleneck-range-preserve'
        run: python3 tools/apply_japanese_ui.py

      - name: Test cartridge diagnostics and frame sampler
        run: |
          python3 tools/test_cart_diagnostic.py
          python3 tools/test_write_diagnostic.py
          python3 tools/test_range_preserve.py

      - name: Install clang 21
        run: curl https://apt.llvm.org/llvm.sh | sudo bash -s -- 21

      - name: Checkout vitasdk
        uses: actions/checkout@v4
        with:
          repository: vitasdk/vdpm
          path: vdpm

      - name: Install vitasdk
        run: |
          cd vdpm
          ./bootstrap-vitasdk.sh
          export PATH="$VITASDK/bin:$PATH"
          export VDPM_PACMAN="$VITASDK/libexec/vdpm/pacman"
          test -x "$VDPM_PACMAN"
          # The current all-packages list installs legacy OpenSSL 1.0 and then
          # cpython3, which requires the conflicting OpenSSL 1.1 package.
          # DSVita does not need cpython3, so omit that unrelated package.
          sed -i '/^[[:space:]]*cpython3[[:space:]]*$/d' include/install-packages.sh
          ./install-all.sh
        env:
          VITASDK: /usr/local/vitasdk
          VDPM_NONINTERACTIVE: 1

      - name: Install cargo-vita
        run: cargo +nightly install cargo-vita
        env:
          VITASDK: /usr/local/vitasdk

      - name: Build
        run: ${{ matrix.env }} cargo vita build vpk --profile ${{ matrix.flavor }}
        env:
          VITASDK: /usr/local/vitasdk
          CARGO_INCREMENTAL: 0

      - name: Upload vpk
        uses: actions/upload-artifact@v4
        with:
          name: dsvita-${{ matrix.flavor }}-vpk
          path: target/armv7-sony-vita-newlibeabihf/${{ matrix.flavor }}/dsvita.vpk

      - name: Upload elf
        uses: actions/upload-artifact@v4
        with:
          name: dsvita-${{ matrix.flavor }}-elf
          path: target/armv7-sony-vita-newlibeabihf/${{ matrix.flavor }}/dsvita.elf
